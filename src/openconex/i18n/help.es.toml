types = "DA"

[[shear.fields]]
key = "outstanding_leg"
label = "Ala saliente"
group = "Geometría"
what = "Ancho del ala saliente del ángulo."
how = "Escriba el ancho; se usa con soldadura al apoyo o tracción."
effect = "Define el brazo de palanca de la soldadura y la tracción."
types = "DA"

[[shear.fields]]
key = "beam_leh"
label = "Extremo de viga a pernos"
group = "Geometría"
what = "Distancia del extremo de la viga a la línea de pernos."
how = "Escriba la distancia; se usa en el desgarro del alma con tracción."
effect = "Afecta el desgarro del alma de la viga bajo carga axial."
types = "DA, PS, PSE"

[[shear.fields]]
key = "offset"
label = "Desplazamiento"
group = "Geometría"
what = "Separación entre los ejes de dos vigas back-to-back."
how = "Escriba el desplazamiento; active la fila de pernos compartida."
effect = "Añade la comprobación de la fila compartida para 2R."
default = "0"
types = "DA"

[[shear.fields]]
key = "skew"
label = "Esviaje"
group = "Placa doblada"
what = "Ángulo entre la viga y el apoyo, escrito como 6:12, grados o radianes."
how = "Escriba el esviaje; se usa en el plano y el 3D."
effect = "No cambia las fórmulas resistentes; cambia la geometría dibujada."
types = "PD"

[[shear.fields]]
key = "row_distance"
label = "Distancia entre filas"
group = "Placa doblada"
what = "Distancia entre las dos filas verticales de pernos."
how = "Escriba la distancia; junto con load_offset define el reparto."
effect = "Define el reparto A/B por estática simple."
types = "PD"

[[shear.fields]]
key = "load_offset"
label = "Línea de carga a fila B"
group = "Placa doblada"
what = "Distancia de la línea de carga a la fila de pernos B."
how = "Escriba la distancia; debe ser menor que row_distance."
effect = "Define share_a = load_offset/row_distance y por tanto la demanda de cada placa."
types = "PD"

[[shear.fields]]
key = "share_a"
label = "Fracción de carga A"
group = "Placa doblada"
what = "Fracción de la reacción que toma la placa A."
how = "Escriba un valor entre 0 y 1; sustituye al reparto geométrico."
effect = "Cambia la demanda de la placa A y, por diferencia, la de B."
types = "PD"

[[shear.fields]]
key = "share_b"
label = "Fracción de carga B"
group = "Placa doblada"
what = "Fracción de la reacción que toma la placa B."
how = "Escriba un valor entre 0 y 1; alternativa a share_a."
effect = "Cambia la demanda de la placa B; la memoria avisa si es menor que 0,66."
types = "PD"

[[shear.fields]]
key = "plate_a_width"
label = "Ancho de placa A"
group = "Placa doblada"
what = "Ancho de la placa A a lo largo del apoyo."
how = "Escriba el ancho; se usa en el plano, el 3D y la lista de materiales."
effect = "No cambia las fórmulas; cambia la geometría y el peso."
types = "PD"

[[shear.fields]]
key = "plate_b_width"
label = "Ancho de placa B"
group = "Placa doblada"
what = "Ancho de la placa B a lo largo del apoyo."
how = "Escriba el ancho; se usa en el plano, el 3D y la lista de materiales."
effect = "No cambia las fórmulas; cambia la geometría y el peso."
types = "PD"

[[shear.fields]]
key = "plate_a_leg"
label = "Ala soldada A"
