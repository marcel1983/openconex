# Conexión de corte: campos -------------------------------------------------

[[shear.fields]]
key = "project.name"
label = "Nombre"
group = "Proyecto"
what = "Nombre del proyecto."
how = "Escríbalo en Datos del proyecto; se imprime en la memoria."
