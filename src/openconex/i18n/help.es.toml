[[shear.fields]]
key = "a"
label = "Distancia a"
group = "Geometría"
what = "Distancia de la soldadura a la primera línea de pernos."
how = "Escriba a; debe ser positiva."
effect = "Genera el momento excéntrico V·a y cambia el grupo de pernos."
types = "PS, PSE"

[[shear.fields]]
key = "weld"
label = "Soldadura"
group = "Geometría"
what = "Tamaño del filete de soldadura."
how = "Escriba el tamaño; debe ser positivo."
effect = "Afecta la capacidad de soldadura y el espesor mínimo del apoyo."

[[shear.fields]]
key = "support_weld"
label = "Soldadura al apoyo"
group = "Geometría"
what = "Soldadura de los ángulos o del asiento al apoyo."
how = "Escriba el tamaño; si existe, reemplaza los pernos del apoyo."
