[[shear.fields]]
key = "project.number"
label = "Número"
group = "Proyecto"
what = "Número o código del proyecto."
how = "Escríbalo en Datos del proyecto."
effect = "No interviene en el cálculo."

[[shear.fields]]
key = "project.client"
label = "Cliente"
group = "Proyecto"
what = "Cliente del proyecto."
how = "Escríbalo en Datos del proyecto."
effect = "No interviene en el cálculo."

[[shear.fields]]
key = "project.engineer"
label = "Ingeniero"
group = "Proyecto"
what = "Profesional responsable."
how = "Escríbalo en Datos del proyecto."
effect = "No interviene en el cálculo."

[[shear.fields]]
key = "project.revision"
label = "Revisión"
group = "Proyecto"
what = "Revisión del documento."
how = "Escríbala en Datos del proyecto."
effect = "No interviene en el cálculo."
default = "0"

[[shear.fields]]
key = "project.date"
label = "Fecha"
group = "Proyecto"
what = "Fecha del documento."
how = "Escríbala en Datos del proyecto."
effect = "No interviene en el cálculo."

[[shear.fields]]
key = "ui.language"
label = "Idioma"
group = "Proyecto"
what = "Idioma de la memoria y del plano."
how = "Seleccione español o inglés en Datos del proyecto."
effect = "No cambia las fórmulas; cambia los textos y las unidades de presentación."
default = "es"

[[shear.fields]]
key = "ui.units"
label = "Unidades"
group = "Proyecto"
what = "Sistema de unidades del proyecto (US, SI, MKS…)."
how = "Seleccione un preset o escriba valores con su unidad."
effect = "Convierte los valores guardados; el cálculo interno es siempre el mismo."
default = "SI_kN_m"

[[shear.fields]]
key = "type"
label = "Tipo de conexión"
group = "Conexión"
what = "Tipología resistente que se va a calcular."
how = "Seleccione el tipo en el desplegable; la ventana muestra solo los campos aplicables."
effect = "Determina qué comprobaciones se ejecutan y qué campos son obligatorios."
default = "single_plate"

[[shear.fields]]
key = "beam"
label = "Viga"
group = "Conexión"
what = "Sección de la viga que llega a la conexión."
how = "Elija una etiqueta del catálogo AISC o escriba una sección W genérica."
effect = "Aporta tw, d, tf, bf y el material; afecta pernos, placa, destaje y viga."

[[shear.fields]]
key = "beam_grade"
label = "Acero de la viga"
group = "Conexión"
what = "Grado del acero de la viga del catálogo."
how = "Escríbalo o elija uno de la biblioteca de materiales."
effect = "Define Fy y Fu de la viga para las comprobaciones del alma y del destaje."
default = "ASTM A992"

[[shear.fields]]
key = "support"
label = "Apoyo"
group = "Conexión"
what = "Columna o viga principal que recibe la conexión."
how = "Elija una etiqueta del catálogo o una sección W genérica."
effect = "Aporta el espesor del ala o del alma y su Fu para aplastamiento y soldadura."

[[shear.fields]]
key = "support_grade"
label = "Acero del apoyo"
group = "Conexión"
what = "Grado del acero del apoyo del catálogo."
how = "Escríbalo o elija uno de la biblioteca."
effect = "Define Fy y Fu del apoyo para aplastamiento, desgarro y soldadura."
default = "ASTM A992"

[[shear.fields]]
key = "support_element"
label = "Unido al"
group = "Conexión"
what = "Parte del apoyo a la que se conecta la placa o el ángulo."
how = "Seleccione Ala o Alma."
effect = "Elige el espesor del apoyo: tf para ala, tw para alma."
default = "flange"

[[shear.fields]]
key = "grade"
label = "Material de placa o ángulo"
group = "Conexión"
what = "Acero de la placa, los ángulos o el rigidizador."
how = "Escríbalo o elija uno de la biblioteca."
effect = "Define Fy y Fu de la placa o ángulo en todas sus comprobaciones."
default = "ASTM A572 Gr. 50"

[[shear.fields]]
key = "electrode"
label = "Electrodo"
group = "Conexión"
what = "Clasificación del electrodo de las soldaduras."
how = "Escríbalo o elija uno de la biblioteca (E60XX, E70XX…)."
effect = "Define FEXX y el coeficiente C1 de la Tabla 8-3; afecta la capacidad de soldadura."
default = "E70XX"

[[shear.fields]]
key = "deformation_considered"
label = "Deformación en el agujero"
group = "Conexión"
what = "Indica si se considera la deformación en servicio en el aplastamiento."
how = "Marque la casilla para usar 2,4 d t Fu; desmárquela para 3,0 d t Fu."
effect = "Cambia la capacidad de aplastamiento de la placa y del alma."
default = "true"

[[shear.fields]]
key = "bolt"
label = "Pernos"
group = "Pernos"
what = "Grupo de pernos de la conexión."
how = "Abra el bloque de pernos y defina diámetro, grado, roscas y agujero."
effect = "Afecta corte, aplastamiento, desgarro y bloque de corte."

[[shear.fields]]
key = "bolt.diameter"
label = "Diámetro"
group = "Pernos"
what = "Diámetro nominal del perno."
how = "Escriba el diámetro (por ejemplo, 3/4 in)."
effect = "Afecta el área, el corte, el aplastamiento y las distancias mínimas."
default = "3/4 in"

[[shear.fields]]
key = "bolt.grade"
label = "Grado del perno"
group = "Pernos"
what = "Especificación del perno (A325, A490, F1852…)."
how = "Elija un grado de la biblioteca de pernos."
effect = "Define Fnv, Fnt y Fu; afecta corte, tracción y aplastamiento."
default = "ASTM F3125 Gr. A325"

[[shear.fields]]
key = "bolt.threads"
label = "Roscas"
group = "Pernos"
what = "Condición de roscas en el plano de corte."
how = "Seleccione N (incluidas) o X (excluidas)."
effect = "Cambia Fnv y por tanto la capacidad a corte del perno."
default = "N"

[[shear.fields]]
key = "bolt.hole"
label = "Agujero"
group = "Pernos"
what = "Tipo de agujero: estándar, sobredimensionado o alargado."
how = "Seleccione el tipo; el programa usa sus dimensiones para aplastamiento y áreas netas."
effect = "Afecta aplastamiento, desgarro y áreas netas de placa y alma."
default = "STD"

[[shear.fields]]
key = "cope"
label = "Destaje"
group = "Destaje"
what = "Recorte del extremo de la viga."
how = "Active el bloque de destaje y defina sus dimensiones."
effect = "Activa las comprobaciones de la sección destajada y del bloque de corte del alma."

[[shear.fields]]
key = "cope.c"
label = "Largo c"
group = "Destaje"
what = "Longitud del destaje medida desde el apoyo."
how = "Escriba c; debe ser mayor que cero."
effect = "Afecta la esbeltez, la flexión y el bloque de corte de la viga destajada."

[[shear.fields]]
key = "cope.dc"
label = "Profundidad superior"
group = "Destaje"
what = "Profundidad del destaje en el ala superior."
how = "Escriba dc; use 0 si no hay destaje superior."
effect = "Reduce el canto útil y cambia S, Z y la resistencia a flexión."

[[shear.fields]]
key = "cope.dc_bottom"
label = "Profundidad inferior"
group = "Destaje"
what = "Profundidad del destaje en el ala inferior."
how = "Escriba dc,inf; use 0 para destaje solo superior."
effect = "Cambia la sección destajada y las comprobaciones de flexión."
default = "0"

[[shear.fields]]
key = "cope.setback"
label = "Holgura"
group = "Destaje"
what = "Separación entre el apoyo y el extremo de la viga."
how = "Escriba la holgura; por defecto 1/2 in."
effect = "La reacción se aplica a e = c + holgura; afecta el momento del destaje."
default = "0.5 in"

[[shear.fields]]
key = "cope.lev"
label = "l_ev del destaje"
group = "Destaje"
what = "Distancia vertical desde el borde del destaje al primer perno."
how = "Escriba l_ev si comprueba el bloque de corte del alma."
effect = "Se usa en el bloque de corte del alma destajada."

[[shear.fields]]
key = "cope.leh"
label = "l_eh del destaje"
group = "Destaje"
what = "Distancia horizontal desde el extremo de la viga a la línea de pernos."
how = "Escriba l_eh; el programa resta la tolerancia de longitud."
effect = "Se usa en el bloque de corte del alma destajada."

[[shear.fields]]
key = "cope.doubler"
label = "Placa doble"
group = "Destaje"
what = "Placa soldada al alma destajada para reforzarla."
how = "Active la placa doble y defina espesor, profundidad, separación y soldadura."
effect = "Aumenta la sección y la resistencia a flexión y corte del destaje."

[[shear.fields]]
key = "cope.doubler.thickness"
label = "Espesor de placa doble"
group = "Destaje"
what = "Espesor de la placa doble."
how = "Escriba el espesor; debe ser positivo."
effect = "Aumenta A, I, S y Z de la sección reforzada."

[[shear.fields]]
key = "cope.doubler.depth"
label = "Profundidad de placa doble"
group = "Destaje"
what = "Altura de la placa doble."
how = "Escriba la profundidad; debe ser positiva."
effect = "Aumenta la sección reforzada y la resistencia a flexión."

[[shear.fields]]
key = "cope.doubler.gap"
label = "Separación de placa doble"
group = "Destaje"
what = "Distancia desde la línea del destaje a la cara de la placa."
how = "Escriba la separación; por defecto 1/2 in."
effect = "Cambia la posición del centro de gravedad y el flujo de soldadura."
default = "0.5 in"

[[shear.fields]]
key = "cope.doubler.weld"
label = "Soldadura de placa doble"
group = "Destaje"
what = "Filete de soldadura en cada lado de la placa doble."
how = "Escriba el tamaño; debe ser positivo."
effect = "Se comprueba el flujo de corte Q/I y la capacidad del filete."
default = "3/16 in"

[[shear.fields]]
key = "cope.stiffener"
label = "Rigidizador longitudinal"
group = "Destaje"
what = "Rigidizador soldado a lo largo de la línea del destaje."
how = "Active el rigidizador y defina ancho, espesor, soldadura y longitud."
effect = "Aumenta la sección y estabiliza el ala comprimida."

[[shear.fields]]
key = "cope.stiffener.width"
label = "Ancho del rigidizador"
group = "Destaje"
what = "Ancho del rigidizador."
how = "Escriba el ancho; debe ser positivo."
effect = "Aumenta la sección reforzada y el momento plástico."

[[shear.fields]]
key = "cope.stiffener.thickness"
label = "Espesor del rigidizador"
group = "Destaje"
what = "Espesor del rigidizador."
how = "Escriba el espesor; debe ser positivo."
effect = "Afecta la esbeltez y la sección reforzada."

[[shear.fields]]
key = "cope.stiffener.weld"
label = "Soldadura del rigidizador"
group = "Destaje"
what = "Filete del rigidizador a la línea del destaje."
how = "Escriba el tamaño; debe ser positivo."
effect = "Se comprueba el flujo de corte y la capacidad del filete."
default = "1/4 in"

[[shear.fields]]
key = "cope.stiffener.length"
label = "Longitud del rigidizador"
group = "Destaje"
what = "Longitud del rigidizador a lo largo de la viga."
how = "Déjela vacía para usar c + dc."
effect = "Cambia la longitud de soldadura y el peso, no la sección resistente."
default = "c + dc"

[[shear.fields]]
key = "rows"
label = "Filas de pernos"
group = "Geometría"
what = "Número de pernos por línea vertical."
how = "Escriba un entero positivo; en la placa de extremo son filas de dos pernos. Debe cumplirse 2 l_ev + (filas - 1) s ≤ largo."
effect = "Afecta el grupo de pernos, el área neta y el bloque de corte."

[[shear.fields]]
key = "lines"
label = "Líneas de pernos"
group = "Geometría"
what = "Número de líneas verticales de la placa simple extendida."
how = "Use 1 o 2; con 2 debe definir el gramil."
effect = "Duplica el grupo de pernos y cambia el bloque de corte."
default = "1"
types = "PSE"

[[shear.fields]]
key = "spacing"
label = "Separación s"
group = "Geometría"
what = "Distancia vertical entre pernos."
how = "Escriba la separación; el mínimo es 2⅔d y el grupo debe caber en el largo."
effect = "Afecta aplastamiento interior, desgarro y bloque de corte."

[[shear.fields]]
key = "gage"
label = "Gramil g"
group = "Geometría"
what = "Separación entre líneas de pernos o gramil de los ángulos."
how = "En placa extendida con dos líneas, escriba la separación; en doble ángulo con tracción, el gramil de las alas."
effect = "Cambia el grupo de pernos y el brazo de palanca de la tracción."
types = "PSE, DA"

[[shear.fields]]
key = "length"
label = "Largo"
group = "Geometría"
what = "Largo de la placa, ángulo, asiento o rigidizador."
how = "Escriba el largo; debe alojar el grupo de pernos: largo ≥ 2 l_ev + (filas - 1) s."
effect = "Afecta corte, bloque de corte, soldadura y peso."

[[shear.fields]]
key = "thickness"
label = "Espesor"
group = "Geometría"
what = "Espesor de la placa, ángulo, asiento o rigidizador."
how = "Escriba el espesor; debe ser positivo."
effect = "Afecta todas las capacidades de la placa y el tamaño máximo de soldadura."

[[shear.fields]]
key = "lev"
label = "l_ev"
group = "Geometría"
what = "Distancia vertical del perno extremo al borde."
how = "Escriba la distancia al borde superior o inferior; el mínimo es la Tabla J3.4."
effect = "Afecta el desgarro del perno de borde y el espacio disponible."

[[shear.fields]]
key = "leh"
label = "l_eh"
group = "Geometría"
what = "Distancia horizontal al borde de la placa."
how = "En el doble ángulo, es la distancia en el ala sobre el alma de la viga; el mínimo es la Tabla J3.4."
effect = "Afecta el desgarro y el bloque de corte."

[[shear.fields]]
key = "leh_support"
label = "l_eh en el apoyo"
group = "Geometría"
what = "Distancia horizontal al borde en las alas salientes del ángulo."
how = "Escriba l_eh del lado del apoyo; el mínimo es la Tabla J3.4."
