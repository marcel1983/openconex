types = "DA, AS"

[[shear.fields]]
key = "beam_weld"
label = "Soldadura al alma de la viga"
group = "Geometría"
what = "Soldadura de los ángulos al alma de la viga."
how = "Escriba el tamaño; requiere el ala sobre el alma."
