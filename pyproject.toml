[build-system]
requires = ["hatchling>=1.24", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "openconex"
dynamic = ["version", "readme"]
description = "Free software for the design of steel connections to AISC 360 (base plates, beam-column, beam-beam, splices)"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "The OpenConex contributors" }]
keywords = ["steel", "connections", "AISC", "base plate", "structural engineering"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Natural Language :: Spanish",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pint>=0.24",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "latex2mathml>=3.77",
    "python-docx>=1.1",
    "ezdxf>=1.3",
    "openpyxl>=3.1",
    "Pillow>=10",
]

[project.optional-dependencies]
pdf = ["PySide6>=6.8"]
gui = ["PySide6>=6.8"]
3d = ["cadquery-ocp-novtk>=7.8"]
gui-test = ["pytest-qt>=4.4"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.6",
    "pip-licenses>=5",
]

[project.scripts]
openconex = "openconex.cli:main"
openconex-gui = "openconex.gui:main"

[project.urls]
Repository = "https://github.com/marcel1983/openconex"
Documentation = "https://github.com/marcel1983/openconex/tree/main/docs"
Issues = "https://github.com/marcel1983/openconex/issues"
Releases = "https://github.com/marcel1983/openconex/releases"

# PyPI renders the README without the repository around it: relative links and
# images are rewritten to absolute GitHub URLs so they still work there.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(src|href)="(?!https?://|#)([^"]+)"'
replacement = '\1="https://raw.githubusercontent.com/marcel1983/openconex/main/\2"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)]+)\)'
replacement = '](https://github.com/marcel1983/openconex/blob/main/\1)'

[tool.hatch.version]
path = "src/openconex/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/openconex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "RUF", "C90"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # unicode symbols (², ·, ″) are intended
    "N803", "N806", "N815",  # code symbols as names (Ag, Fy, Znet, pedestal_N…)
]

[tool.ruff.lint.mccabe]
# New functions stay below this; the few above it carry ``# noqa: C901`` until
# they are split (see docs/tecnico/02-convenciones.md).
max-complexity = 25

[tool.ruff.lint.pep8-naming]
# Engineering symbols keep their code notation (Fy, Fu, Fnt, FEXX…).
ignore-names = ["F*", "E", "E_*"]

[tool.mypy]
python_version = "3.12"
# Typed in stages (docs/tecnico/02-convenciones.md): core, kernel and
# connections, then io/. The GUI stays out for now.
files = [
    "src/openconex/units.py",
    "src/openconex/core",
    "src/openconex/kernel",
    "src/openconex/connections",
]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["openconex.units", "openconex.core.*", "openconex.kernel.*",
          "openconex.connections.*"]
disallow_untyped_defs = true

[tool.coverage.run]
source = ["openconex"]

[tool.coverage.report]
show_missing = true
