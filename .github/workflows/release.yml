name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existente (vacío: construir el ref actual)"
        required: false
        default: ""
      publish:
        description: "Crear o actualizar el release"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: macos-14
            platform: macos-arm64
          - os: ubuntu-22.04
            platform: linux-x86_64
    steps:
      - name: Require a tag when publishing manually
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && inputs.tag == '' }}
        run: |
          echo "::error::Indique el tag existente en el campo 'tag' para publicar un release."
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: System libraries for Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libnss3 libxkbcommon0 libgbm1 libasound2 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1 libxcb-cursor0
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[gui,pdf,3d]" pyinstaller
      - name: Build portable bundle
        run: python packaging/build_portable.py ${{ matrix.platform }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portable-${{ matrix.platform }}
          path: |
            dist/OpenConex-*.zip
            dist/SHA256SUMS-*.txt
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    if: ${{ github.event_name == 'push' || inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - name: Build wheel and sdist
        run: python -m build --outdir dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: portable
          merge-multiple: true
      - name: Assemble assets
        run: |
          cp portable/OpenConex-*.zip dist/
          cat portable/SHA256SUMS-*.txt > dist/SHA256SUMS.txt
          cd dist
          sha256sum *.whl *.tar.gz >> SHA256SUMS.txt
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          test "v${VERSION}" = "${TAG}" || { echo "tag/version mismatch"; exit 1; }
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target main --title "OpenConex $VERSION" --generate-notes
          gh release upload "$TAG" dist/OpenConex-*.zip dist/*.whl dist/*.tar.gz dist/SHA256SUMS.txt --clobber
