name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: openconex convert "3/4 in" thickness --to mm

  outputs:
    name: outputs (PDF and 3D extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: System libraries for Qt WebEngine (headless)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libnss3 libxkbcommon0 libgbm1 libasound2t64 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1
      - run: python -m pip install -e ".[dev,pdf,3d,gui-test]"
      - run: python -m pytest tests/outputs -ra
      - run: openconex baseplate examples/base_plate_dg1_4_7_11.ocnx -o out/example --html --docx --pdf --dxf --step
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-outputs
          path: out/

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # Runtime dependencies only (with the optional extras): dev tools are not distributed.
      - run: python -m pip install ".[pdf,3d]" pip-licenses
      - run: python tools/check_licenses.py
