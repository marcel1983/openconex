id = "II.A-10"
title = "Conexion sesgada de doble placa doblada (viga a alma de viga principal)"
source = "AISC Design Examples v15.1, Example II.A-10, pp. IIA-99 a IIA-104"
status = "reference"
tolerance = 0.01
notes = """
Las cotas de la figura II.A-10-1 se transcriben en la documentacion tecnica.
El ejemplo reparte la reaccion entre las placas A y B por una analogia de viga
simple: 30/20 kip para A y 50/33,3 kip para B en LRFD/ASD.
Los pernos son de 7/8 in (Tabla 7-1: 24,3 kip/perno en corte simple).
La placa se tantea con 5/16 in y se aumenta a 3/8 in por rotura por corte.
"""

